<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registry | Asset Inventory</title>
    <style>
        :root { --bg: #FAFAFA; --surface: #FFF; --border: #CBD5E1; --accent: #475569; }
        body { background: var(--bg); padding: 48px 24px; font-family: sans-serif; }
        .container { max-width: 1000px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; margin-top: 32px; }
        .card { background: var(--surface); border: 1px solid var(--border); padding: 24px; border-radius: 8px; text-decoration: none; color: inherit; display: block; }
        .card:hover { border-color: var(--accent); }
        .filter-btn { padding: 8px 16px; cursor: pointer; border: 1px solid var(--border); background: var(--surface); border-radius: 4px; }
        .filter-btn.active { background: var(--accent); color: #FFF; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Asset Registry</h1>
        <div id="filters" style="margin: 24px 0;">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="tool">Tools</button>
            <button class="filter-btn" data-filter="article">Articles</button>
        </div>
        <div id="grid" class="grid"></div>
    </div>

    <script>
        let assets = [];
        const grid = document.getElementById('grid');

        async function load() {
            const res = await fetch('manifest.json');
            assets = await res.json();
            render('all');
        }

        function render(filter) {
            grid.innerHTML = '';
            assets.filter(a => filter === 'all' || a.type === filter).forEach(a => {
                grid.innerHTML += `
                    <a href="${a.path}" class="card">
                        <h3>${a.title}</h3>
                        <p style="color: #666; font-size: 14px;">${a.description}</p>
                    </a>
                `;
            });
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                render(e.target.dataset.filter);
            });
        });

        load();
    </script>
</body>
</html>
