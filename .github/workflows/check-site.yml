name: Check site

# Runs the zero-dependency static checks in tests/check-site.mjs on every push and pull request.
# It covers local links and anchors, CSP, allowed external hosts, metadata, headings, asset
# cache-busting, manifest parity, sitemap.xml, and whether sw.js is up to date.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Static site checks
        run: node tests/check-site.mjs
