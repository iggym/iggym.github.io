<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Interactive Engineering Tools</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
--bg:#FAFAFA;
--text:#111827;
--muted:#6B7280;
--border:#E5E7EB;
--accent:#10B981;
}

body{
font-family:Inter,sans-serif;
background:var(--bg);
color:var(--text);
margin:0;
}

.container{
width:min(92%,1200px);
margin:auto;
padding:48px 0;
}

a{
color:var(--accent);
text-decoration:none;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
margin-top:32px;
}

.card{
background:white;
padding:24px;
border:1px solid var(--border);
border-radius:16px;
}

.tags{
display:flex;
flex-wrap:wrap;
gap:8px;
margin:16px 0;
}

.tag{
background:#F3F4F6;
padding:6px 10px;
border-radius:999px;
font-size:.8rem;
}

.launch{
display:inline-block;
margin-top:12px;
}

input{
width:100%;
padding:12px;
border-radius:12px;
border:1px solid var(--border);
}

</style>
</head>

<body>

<div class="container">

<p>
<a href="index.html">← Back to Overview</a>
</p>

<h1>Interactive Tools</h1>

<input
id="search"
placeholder="Filter tools..."
>

<div id="toolGrid" class="grid"></div>

</div>

<script>

let allTools=[];

async function load(){

const data=
await fetch('./manifest.json').then(r=>r.json());

allTools=
data.filter(x=>x.type==="tool");

render(allTools);
}

function render(items){

document.getElementById('toolGrid').innerHTML=
items.map(item=>`

<div class="card">

<h3>${item.title}</h3>

<p>${item.description}</p>

<div class="tags">
${item.tags.map(tag=>`
<span class="tag">${tag}</span>
`).join('')}
</div>

<a class="launch" href="${item.path}">
Launch Tool →
</a>

</div>

`).join('');
}

document.getElementById('search')
.addEventListener('input',(e)=>{

const q=e.target.value.toLowerCase();

render(
allTools.filter(tool=>
tool.title.toLowerCase().includes(q) ||
tool.tags.join(' ').toLowerCase().includes(q)
)
);

});

load();

</script>

</body>
</html>
