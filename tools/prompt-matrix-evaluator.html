<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Matrix Evaluator // Iggy</title>
    <meta name="description" content="Paste a prompt. This page strips common filler and shows the estimated token change. It does not score constraints.">
    <style>
        :root {
            --bg-color: #0b0b0c;
            --panel-bg: #121214;
            --border-color: #1f1f23;
            --text-main: #f4f4f6;
            --text-muted: #8a8a93;
            --accent-blue: #2563eb;
            --accent-green: #10b981;
            --font-mono: 'SF Mono', 'Menlo', 'Courier New', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 2rem;
            line-height: 1.5;
        }

        header {
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 1rem;
        }

        header h1 { font-size: 1.25rem; font-weight: 500; letter-spacing: -0.02em; margin-top: 0.25rem; }
        header .status { font-family: var(--font-mono); font-size: 0.75rem; color: var(--accent-green); white-space: nowrap; }

        .breadcrumb { font-family: var(--font-mono); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
        .breadcrumb a { color: var(--text-muted); text-decoration: none; transition: color 0.2s ease; }
        .breadcrumb a:hover { color: var(--accent-blue); text-decoration: underline; text-underline-offset: 4px; }
        .breadcrumb span { color: var(--text-main); }

        .note { font-size: 0.85rem; color: var(--text-muted); max-width: 42rem; }

        .workspace { display: flex; flex-direction: column; gap: 2rem; }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
        }

        .panel-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-family: var(--font-mono);
            margin-bottom: 1rem;
        }

        textarea {
            width: 100%; background: #18181b; border: 1px solid var(--border-color);
            color: var(--text-main); border-radius: 4px; padding: 0.75rem;
            font-family: var(--font-mono); font-size: 0.85rem; height: 100px; resize: vertical; outline: none;
        }
        textarea:focus { border-color: var(--accent-blue); }

        .matrix-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        @media (max-width: 768px) {
            body { padding: 1rem; }
            header { flex-direction: column; align-items: flex-start; }
            .matrix-grid { grid-template-columns: 1fr; }
        }

        .matrix-card {
            background: #18181b;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .card-header {
            display: flex; justify-content: space-between; align-items: center; gap: 0.75rem;
            border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;
        }
        .card-tag { font-family: var(--font-mono); font-size: 0.75rem; font-weight: bold; }
        .card-meta { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-muted); text-align: right; }

        .compiled-text { font-size: 0.85rem; white-space: pre-wrap; color: #d4d4d8; min-height: 120px; }

        .copy-btn {
            align-self: flex-start;
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            padding: 0.35rem 0.6rem;
            cursor: pointer;
        }
        .copy-btn:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
    </style>
</head>
<body>

    <header>
        <div>
            <nav class="breadcrumb">
                <a href="https://iggym.github.io/">Home</a> / <span>prompt-matrix-evaluator</span>
            </nav>
            <h1>Prompt Matrix Evaluator</h1>
            <p class="note">Paste a prompt. This page strips common filler and shows the estimated token change. It does not call a model and it does not score constraints.</p>
        </div>
        <div class="status">// LOCAL · NO MODEL</div>
    </header>

    <main class="workspace">
        <section class="panel">
            <div class="panel-title">Prompt</div>
            <textarea id="raw-prompt" oninput="processMatrix()">Please explain how a queue retries a failed job, and make sure to say what happens if things crash.</textarea>

            <div class="matrix-grid">
                <div class="matrix-card">
                    <div class="card-header">
                        <span class="card-tag" style="color: var(--accent-blue)">01 // AS TYPED</span>
                        <span class="card-meta" id="meta-original">Estimate: --</span>
                    </div>
                    <div class="compiled-text" id="out-original"></div>
                    <button class="copy-btn" type="button" id="copy-original">Copy</button>
                </div>

                <div class="matrix-card">
                    <div class="card-header">
                        <span class="card-tag" style="color: var(--accent-green)">02 // TIGHTENED</span>
                        <span class="card-meta" id="meta-tight">Estimate: --</span>
                    </div>
                    <div class="compiled-text" id="out-tight"></div>
                    <button class="copy-btn" type="button" id="copy-tight">Copy</button>
                </div>
            </div>
        </section>
    </main>

    <script>
        var FILLER = [
            /provide a completely detailed/gi,
            /provide a detailed/gi,
            /make sure to/gi,
            /make sure that/gi,
            /be sure to/gi,
            /be sure that/gi,
            /if things crash/gi,
            /i would like you to/gi,
            /i want you to/gi,
            /i need you to/gi,
            /could you please/gi,
            /can you please/gi,
            /would you please/gi,
            /don'?t forget to/gi,
            /do not forget to/gi,
            /feel free to/gi,
            /go ahead and/gi,
            /it is important that/gi,
            /it is important to/gi,
            /it'?s important that/gi,
            /it'?s important to/gi,
            /as much as possible/gi,
            /in a detailed manner/gi,
            /\bplease\b/gi,
            /\bkindly\b/gi
        ];

        function estimateTokens(text) {
            return Math.ceil(text.length / 4);
        }

        function tighten(raw) {
            var text = raw;
            for (var i = 0; i < FILLER.length; i++) {
                text = text.replace(FILLER[i], " ");
            }
            text = text.replace(/[ \t]{2,}/g, " ");
            text = text.replace(/[ \t]*\n[ \t]*/g, "\n");
            text = text.replace(/\n{3,}/g, "\n\n");
            text = text.replace(/\s+([,.;:!?])/g, "$1");
            text = text.replace(/^[ \t]+/gm, "");
            text = text.replace(/\s+,/g, ",");
            text = text.replace(/,\s*,/g, ",");
            text = text.trim();
            if (text) text = text.charAt(0).toUpperCase() + text.slice(1);
            return text;
        }

        function formatDelta(before, after) {
            var delta = before - after;
            if (delta === 0) return "no estimated change";
            if (delta > 0) return "about " + delta + " fewer";
            return "about " + Math.abs(delta) + " more";
        }

        function processMatrix() {
            var raw = document.getElementById("raw-prompt").value;
            var tight = tighten(raw);
            var before = estimateTokens(raw);
            var after = estimateTokens(tight);

            document.getElementById("out-original").innerText = raw;
            document.getElementById("out-tight").innerText = tight || "(nothing left after stripping filler)";
            document.getElementById("meta-original").innerText = "Estimate: " + before + " tokens";
            document.getElementById("meta-tight").innerText = "Estimate: " + after + " tokens · " + formatDelta(before, after);
        }

        function copyText(id, button) {
            var text = document.getElementById(id).innerText;
            var done = function () {
                var previous = button.textContent;
                button.textContent = "Copied";
                setTimeout(function () { button.textContent = previous; }, 1200);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(done).catch(function () {
                    fallbackCopy(text, done);
                });
            } else {
                fallbackCopy(text, done);
            }
        }

        function fallbackCopy(text, done) {
            var area = document.createElement("textarea");
            area.value = text;
            document.body.appendChild(area);
            area.select();
            try { document.execCommand("copy"); } catch (err) {}
            document.body.removeChild(area);
            done();
        }

        document.getElementById("copy-original").addEventListener("click", function () {
            copyText("out-original", this);
        });
        document.getElementById("copy-tight").addEventListener("click", function () {
            copyText("out-tight", this);
        });

        window.onload = processMatrix;
    </script>
</body>
</html>
