<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Model Workspace Aggregator</title>
    <style>
        :root {
            --bg-main: #0b0d11;
            --bg-panel: #13161c;
            --bg-input: #1e232b;
            --border: #2c333f;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --openai-color: #10a37f;
            --anthropic-color: #d97706;
            --accent: #3b82f6;
            --radius: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            flex-wrap: wrap;
            gap: 16px;
        }

        .brand-meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        h1 { font-size: 1.1rem; font-weight: 600; }
        
        .back-link {
            font-size: 0.8rem;
            color: var(--accent);
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: #2563eb;
            text-decoration: underline;
        }
        
        .api-settings {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .key-input-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 4px 8px;
        }

        .key-input-wrapper label {
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .key-input-wrapper input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.85rem;
            width: 140px;
            outline: none;
        }

        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1px;
            background-color: var(--border);
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .workspace {
                grid-template-columns: 1fr 1fr;
            }
        }

        .model-panel {
            background-color: var(--bg-panel);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot { width: 8px; height: 8px; border-radius: 50%; }
        .dot.openai { background-color: var(--openai-color); }
        .dot.anthropic { background-color: var(--anthropic-color); }

        .model-select {
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 0.8rem;
            outline: none;
        }

        .panel-output {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre-wrap;
            color: #e5e7eb;
        }

        .panel-output.loading {
            opacity: 0.5;
        }

        .input-console {
            background-color: var(--bg-panel);
            border-top: 1px solid var(--border);
            padding: 16px;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .prompt-textarea {
            flex: 1;
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-main);
            padding: 12px;
            font-size: 0.95rem;
            resize: none;
            height: 60px;
            outline: none;
            transition: border-color 0.2s;
        }

        .prompt-textarea:focus {
            border-color: var(--accent);
        }

        .submit-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: var(--radius);
            padding: 0 24px;
            height: 60px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .submit-btn:hover { background-color: #2563eb; }
        .submit-btn:disabled { background-color: var(--border); cursor: not-allowed; color: var(--text-muted); }
    </style>
</head>
<body>

    <header>
        <div class="brand-meta">
            <h1>Multi-Model Workspace</h1>
            <a href="https://iggym.github.io/#tools" class="back-link">← Iggy — AI Systems Architect & Builder</a>
        </div>
        <div class="api-settings">
            <div class="key-input-wrapper">
                <label style="color: var(--openai-color)">OpenAI Key</label>
                <input type="password" id="openaiKey" placeholder="sk-..." onchange="saveKeys()">
            </div>
            <div class="key-input-wrapper">
                <label style="color: var(--anthropic-color)">Anthropic Key</label>
                <input type="password" id="anthropicKey" placeholder="sk-ant-..." onchange="saveKeys()">
            </div>
        </div>
    </header>

    <div class="workspace">
        <div class="model-panel">
            <div class="panel-header">
                <div class="panel-title"><span class="dot openai"></span> OpenAI Engine</div>
                <select id="openaiModel" class="model-select">
                    <option value="gpt-4o-mini">gpt-4o-mini</option>
                    <option value="gpt-4o">gpt-4o</option>
                    <option value="o1-preview">o1-preview</option>
                </select>
            </div>
            <div class="panel-output" id="openaiOutput">Submit a query below. If no API keys are provided, the interface runs in Mock Simulation Mode.</div>
        </div>

        <div class="model-panel">
            <div class="panel-header">
                <div class="panel-title"><span class="dot anthropic"></span> Anthropic Engine</div>
                <select id="anthropicModel" class="model-select">
                    <option value="claude-3-5-haiku-latest">claude-3-5-haiku</option>
                    <option value="claude-3-5-sonnet-latest">claude-3-5-sonnet</option>
                </select>
            </div>
            <div class="panel-output" id="anthropicOutput">Submit a query below. If no API keys are provided, the interface runs in Mock Simulation Mode.</div>
        </div>
    </div>

    <div class="input-console">
        <textarea id="promptInput" class="prompt-textarea" placeholder="Type your dynamic query here... (Press Cmd/Ctrl + Enter to dispatch)"></textarea>
        <button id="submitBtn" class="submit-btn" onclick="executeAggregatedQuery()">Dispatch</button>
    </div>

    <script>
        document.getElementById('openaiKey').value = localStorage.getItem('key_openai') || '';
        document.getElementById('anthropicKey').value = localStorage.getItem('key_anthropic') || '';

        function saveKeys() {
            localStorage.setItem('key_openai', document.getElementById('openaiKey').value.trim());
            localStorage.setItem('key_anthropic', document.getElementById('anthropicKey').value.trim());
        }

        document.getElementById('promptInput').addEventListener('keydown', function(e) {
            if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
                e.preventDefault();
                executeAggregatedQuery();
            }
        });

        async function executeAggregatedQuery() {
            const prompt = document.getElementById('promptInput').value.trim();
            if (!prompt) return;

            const oaiKey = document.getElementById('openaiKey').value.trim();
            const antKey = document.getElementById('anthropicKey').value.trim();

            const oaiOutput = document.getElementById('openaiOutput');
            const antOutput = document.getElementById('anthropicOutput');
            const submitBtn = document.getElementById('submitBtn');

            oaiOutput.innerHTML = "Awaiting response pipeline...";
            antOutput.innerHTML = "Awaiting response pipeline...";
            oaiOutput.classList.add('loading');
            antOutput.classList.add('loading');
            submitBtn.disabled = true;

            if (!oaiKey && !antKey) {
                setTimeout(() => {
                    oaiOutput.innerHTML = `[MOCK SIMULATION MODE - OpenAI]\n\nReceived prompt: "${prompt}"\n\nTo view real API outputs, insert your valid platform API secret keys into the top dashboard settings bar.`;
                    antOutput.innerHTML = `[MOCK SIMULATION MODE - Anthropic]\n\nReceived prompt: "${prompt}"\n\nTo view real API outputs, insert your valid platform API secret keys into the top dashboard settings bar.`;
                    oaiOutput.classList.remove('loading');
                    antOutput.classList.remove('loading');
                    submitBtn.disabled = false;
                }, 1000);
                return;
            }

            await Promise.all([
                callOpenAI(prompt, oaiKey, oaiOutput),
                callAnthropic(prompt, antKey, antOutput)
            ]);

            submitBtn.disabled = false;
        }

        async function callOpenAI(prompt, key, outputElement) {
            if (!key) {
                outputElement.innerHTML = "Skipped. No OpenAI key found.";
                outputElement.classList.remove('loading');
                return;
            }
            const model = document.getElementById('openaiModel').value;

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${key}`
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: [{ role: 'user', content: prompt }]
                    })
                });

                const data = await response.json();
                if (data.error) {
                    outputElement.textContent = `API Error: ${data.error.message}`;
                } else {
                    outputElement.textContent = data.choices[0].message.content;
                }
            } catch (err) {
                outputElement.textContent = `Network Exception Connection Failed: ${err.message}`;
            } finally {
                outputElement.classList.remove('loading');
            }
        }

        async function callAnthropic(prompt, key, outputElement) {
            if (!key) {
                outputElement.innerHTML = "Skipped. No Anthropic key found.";
                outputElement.classList.remove('loading');
                return;
            }
            const model = document.getElementById('anthropicModel').value;

            try {
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': key,
                        'anthropic-version': '2023-06-01',
                        'anthropic-dangerously-allow-browser': 'true'
                    },
                    body: JSON.stringify({
                        model: model,
                        max_tokens: 4096,
                        messages: [{ role: 'user', content: prompt }]
                    })
                });

                const data = await response.json();
                if (data.error) {
                    outputElement.textContent = `API Error: ${data.error.message}`;
                } else {
                    outputElement.textContent = data.content[0].text;
                }
            } catch (err) {
                outputElement.textContent = `Network Exception Connection Failed: ${err.message}\n\nNote: If CORS blocking errors occur locally, launch your file using a local web server tool or a browser with disabled local CORS checks.`;
            } finally {
                outputElement.classList.remove('loading');
            }
        }
    </script>
</body>
</html>
