<script>
  var Q0 = new URLSearchParams(location.search);
  if (Q0.get('render') === '1') document.documentElement.classList.add('render');
  if (Q0.get('og') === '1') document.documentElement.classList.add('og');
</script>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f8fafc;color:#0f172a}
  :focus-visible{outline:3px solid #c2410c;outline-offset:2px}
  .wrap{max-width:40rem;margin:0 auto;padding:1.5rem 1rem 2.5rem}
  .by{font-size:.875rem;color:#475569;margin:0}
  h1{font-size:1.9rem;line-height:1.15;margin:.25rem 0 .5rem;font-weight:800}
  h2{font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:#475569;margin:0 0 .5rem}
  .intro{font-size:1.1rem;color:#334155;margin:0 0 1rem}
  .panel{margin-top:1rem;border:2px solid #cbd5e1;background:#f1f5f9;border-radius:1rem;padding:1rem}
  label{display:block;font-weight:700;margin:.6rem 0 .2rem}
  input[type=number],input[type=text],select,textarea{font:inherit;width:100%;min-height:48px;padding:.5rem .7rem;border:2px solid #64748b;border-radius:.6rem;background:#fff;color:#0f172a}
  textarea{min-height:11rem;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem}
  input[type=range]{width:100%;min-height:48px}
  button{font:inherit;min-height:48px;padding:.5rem 1rem;border-radius:.6rem;border:2px solid #64748b;background:#fff;font-weight:700;cursor:pointer;color:#0f172a}
  button.pri{background:#0f172a;color:#fff;border-color:#0f172a}
  button[aria-pressed=true]{background:#0f172a;color:#fff;border-color:#0f172a}
  .btns{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
  @media(max-width:30rem){.grid2{grid-template-columns:1fr}}
  .out{display:grid;gap:.6rem;margin-top:1rem}
  .card{background:#fff;border:2px solid #94a3b8;border-radius:.8rem;padding:.7rem 1rem}
  .card .l{font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#475569}
  .card .v{font-size:2rem;font-weight:900;line-height:1.1}
  .card .d{font-size:.95rem;color:#334155}
  .card.hi{border-color:#c2410c;background:#fff7ed}
  .card.bad{border-color:#b91c1c;background:#fef2f2}
  .card.good{border-color:#15803d;background:#f0fdf4}
  .small{font-size:.875rem;color:#475569}
  table{border-collapse:collapse;width:100%;font-size:.95rem;background:#fff}
  th,td{border:1px solid #94a3b8;padding:.4rem .5rem;text-align:left;vertical-align:top;word-break:break-all}
  a{color:#0f172a;font-weight:600;overflow-wrap:anywhere}
  li,.card .d,p{overflow-wrap:anywhere}
  pre{background:#0f172a;color:#e2e8f0;padding:.8rem;border-radius:.6rem;overflow:auto;font-size:.85rem;white-space:pre-wrap;word-break:break-all}
  #stage{position:relative;width:min(100%,340px);aspect-ratio:9/16;margin:1.5rem auto 0;overflow:hidden;border-radius:16px;background:#0b1530}
  #card{position:absolute;left:0;top:0;width:1080px;height:1920px;padding:70px 80px;background:#0b1530;color:#fff;transform-origin:0 0;transform:scale(var(--s,1));display:flex;flex-direction:column;gap:28px}
  .kick{font-size:44px;font-weight:600;color:#fdba74}
  .hook{font-size:84px;line-height:1.06;font-weight:800;letter-spacing:-1px}
  .rows{display:flex;flex-direction:column;gap:22px;margin-top:20px}
  .row{background:#fff;color:#0b1020;border-radius:24px;padding:24px 40px;border-left:20px solid #cbd5e1}
  .row.hi{border-left-color:#f97316}
  .rl{font-size:34px;font-weight:800;text-transform:uppercase;letter-spacing:2px;color:#334155}
  .rn{font-size:104px;line-height:1.05;font-weight:900;margin:4px 0 10px;transform-origin:0 60%}
  .rt{font-size:38px;line-height:1.22;font-weight:500}
  .foot{margin-top:auto}
  .cue{font-size:46px;font-weight:800}
  .src{font-size:32px;line-height:1.25;color:#cbd5e1;margin-top:12px}
  .render,.render body{margin:0;background:#0b1530!important;overflow:hidden}
  .render .wrap{max-width:none;padding:0;margin:0}
  .render .wrap>:not(#stage){display:none}
  .render #stage{position:fixed;left:0;top:0;width:1080px;height:1920px;border-radius:0;aspect-ratio:auto;margin:0}
  .og,.og body{margin:0;background:#0b1530!important;overflow:hidden}
  .og .wrap{display:none}
  #ogcard{display:none}
  .og #ogcard{display:flex;width:1200px;height:630px;padding:56px 64px;background:#0b1530;color:#fff;flex-direction:column;gap:22px}
  #ogcard .k{font-size:30px;font-weight:600;color:#fdba74}
  #ogcard .h{font-size:84px;line-height:1.05;font-weight:800;letter-spacing:-1px}
  #ogcard .b{display:flex;gap:24px}
  #ogcard .b div{background:#fff;color:#0b1020;border-radius:18px;padding:14px 26px;font-size:30px;font-weight:600}
  #ogcard .b b{display:block;font-size:60px;line-height:1.05;font-weight:900}
  #ogcard .s{font-size:26px;color:#cbd5e1;margin-top:auto}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <p class="by" id="byline"></p>
  <h1 id="title"></h1>
  <p class="intro" id="intro"></p>

  <section class="panel" aria-labelledby="t1">
    <h2 id="t1">Your slice</h2>
    <div class="btns" role="group" aria-label="Presets">
      <button id="pSound" type="button">Sound Ventures (reported)</button>
      <button id="pEmp" type="button">10,000 shares I hold</button>
      <button id="pReset" type="button">Clear stake</button>
    </div>
    <label for="price">IPO price: <span id="priceV"></span></label>
    <input id="price" type="range" min="70" max="78" step="0.5" value="78">
    <div class="grid2">
      <div><label for="basis">Stake % is of</label>
        <select id="basis"><option value="fd">Fully diluted shares (18.013B)</option><option value="out">Shares outstanding (13.087B)</option></select></div>
      <div><label for="pct">My stake, % of company</label><input id="pct" type="number" inputmode="decimal" min="0" max="100" step="any" placeholder="e.g. 0.5"></div>
      <div><label for="shares">Or: shares I hold</label><input id="shares" type="number" inputmode="numeric" min="0" step="1" placeholder="e.g. 10000"></div>
      <div><label for="inv">Money invested ($, optional)</label><input id="inv" type="number" inputmode="decimal" min="0" step="any" placeholder="e.g. 435000000"></div>
    </div>
    <p class="small">If you fill both a % and a share count, the share count is used.</p>
    <div class="out" aria-live="polite" id="out"></div>
  </section>
  <section aria-label="Share">
    <p class="btns"><button id="share" type="button" class="pri">Copy a share link</button> <button id="replay" type="button">Replay the film</button></p>
    <p class="small" id="sstatus" aria-live="polite"></p>
  </section>
  <div id="stage"><div id="card"></div></div>
  <p class="small" id="note" style="margin-top:1.5rem"></p>
  <footer style="margin-top:1rem;border-top:2px solid #cbd5e1;padding-top:1rem">
    <h2>Sources</h2>
    <ul class="small" id="sources"></ul>
  </footer>
</div>
<div id="ogcard"></div>
<script>
const DATA = {
 "PAGE_URL": "https://iggym.github.io/p/anthropic-ipo-slice/",
 "byline": "By Iggy Mwangi (@iggym)",
 "title": "Same $78 share price. Two Anthropic valuations, $384B apart.",
 "intro": "Headlines quote $1 trillion and $1.4 trillion for the same IPO price. The difference is the share count. Try your own stake.",
 "note": "Gross arithmetic only: price x shares. It ignores option strike prices, taxes, lock-ups, fees and the final pricing. Terms are from the amended S-1 as reported on 2026-11-16 and can change at pricing. The Sound Ventures numbers are Bloomberg-reported estimates from people familiar with the matter, not company statements. Not investment, tax or legal advice. Runs in your browser; nothing you type is sent anywhere.",
 "sources": [
  {
   "label": "Anthropic, roadshow launch (825,000,000 Class A shares, $70-$78, ticker ANT):",
   "url": "https://www.anthropic.com/news/roadshow-launch"
  },
  {
   "label": "World Money Roadmap, share counts from the Nov. 10 S-1/A (13,086,672,593 outstanding; 18,012,993,381 additional-adjustments total, the 'fully diluted' label is theirs):",
   "url": "https://worldmoneyroadmap.com/en/news/2026-11-14-0925-anthropic-ipo-qa-valuation-explainer/"
  },
  {
   "label": "CNBC, offering size and $1.405 trillion fully diluted figure:",
   "url": "https://www.cnbc.com/2026/11/10/anthropic-sets-price-range-of-70-to-78-in-upcoming-ipo.html"
  },
  {
   "label": "tbreak, summarising Bloomberg: Sound Ventures about $435M invested, about 0.5%, about $7B at $1.4T:",
   "url": "https://tbreak.com/sound-ventures-anthropic-stake-7-billion/"
  }
 ],
 "shareText": "Same $78 Anthropic IPO price, two valuations: $1.021T on shares outstanding, $1.405T fully diluted. Try your own stake:",
 "film": {
  "alt": "Short film: at $78 Anthropic is worth $1.021 trillion on shares outstanding and $1.405 trillion fully diluted, a gap of about $384 billion.",
  "hookEnd": 1.5,
  "stepStarts": [
   1.6,
   3.7,
   5.8
  ],
  "dur": 0.8,
  "posterStart": 8,
  "posterFade": 0.5,
  "holdEnd": 9.5,
  "loopAt": 10,
  "kicker": ""
 },
 "s": {
  "out": 13086672593,
  "fd": 18012993381,
  "primary": 801351354,
  "secondary": 23648646
 }
};

const APP=(function(){
  const S=DATA.s; const st={price:78,basis:'fd',pct:'',shares:'',inv:''};
  const fmt=x=>{ const a=Math.abs(x); if(a>=1e12)return '$'+(x/1e12).toFixed(3)+'T'; if(a>=1e9)return '$'+(x/1e9).toFixed(a>=1e11?0:2)+'B'; if(a>=1e6)return '$'+(x/1e6).toFixed(2)+'M'; return '$'+Math.round(x).toLocaleString('en-US'); };
  const money=x=>'$'+x.toLocaleString('en-US',{maximumFractionDigits:2});
  function calc(){ const p=st.price, out=p*S.out, fd=p*S.fd; let slice=null, how='';
    const sh=parseFloat(st.shares), pc=parseFloat(st.pct);
    if(sh>0){ slice=sh*p; how=sh.toLocaleString('en-US')+' shares x '+money(p); }
    else if(pc>0){ const base=st.basis==='fd'?fd:out; slice=base*pc/100; how=pc+'% of '+fmt(base)+' ('+(st.basis==='fd'?'fully diluted':'outstanding')+')'; }
    const inv=parseFloat(st.inv); const mult=(slice!=null&&inv>0)?slice/inv:null;
    return {out,fd,gap:fd-out,slice,how,mult,inv}; }
  function paint(){ const c=calc(); const o=$('out'); o.textContent='';
    const add=(cls,l,v,d)=>{const x=el('div','card '+cls); x.append(el('div','l',l),el('div','v',v),el('div','d',d)); o.append(x);};
    add('','Company value at '+money(st.price)+', shares outstanding',fmt(c.out),'13,086,672,593 shares x price');
    add('hi','Company value at '+money(st.price)+', fully diluted',fmt(c.fd),'18,012,993,381 shares x price (adds options, RSUs, convertible-note shares and more)');
    add('','Gap between the two',fmt(c.gap),'4,926,320,788 potential shares x price');
    if(c.slice!=null){ add('good','Your slice, gross',fmt(c.slice),c.how+(c.mult?'; '+c.mult.toFixed(1)+'x the money invested':'')); }
    add('','Offering proceeds to Anthropic (primary shares)',fmt(S.primary*st.price),'801,351,354 shares x price; the other 23,648,646 shares ('+fmt(S.secondary*st.price)+') are sold by existing holders');
    $('priceV').textContent=money(st.price);
    api.onChange&&api.onChange(); }
  function sync(){ $('price').value=st.price; $('basis').value=st.basis; $('pct').value=st.pct; $('shares').value=st.shares; $('inv').value=st.inv; }
  const api={
    init(){ const p=parseFloat(Q.get('price')); if(p>=70&&p<=78)st.price=p; if(Q.get('basis')==='out')st.basis='out';
      st.pct=Q.get('pct')||''; st.shares=Q.get('shares')||''; st.inv=Q.get('inv')||'';
      if(!Q.has('pct')&&!Q.has('shares'))Object.assign(st,{pct:'0.5',inv:'435000000'});
      sync(); paint();
      if(RENDER||OG) return;
      $('price').oninput=e=>{st.price=parseFloat(e.target.value);paint();};
      $('basis').onchange=e=>{st.basis=e.target.value;paint();};
      $('pct').oninput=e=>{st.pct=e.target.value;paint();}; $('shares').oninput=e=>{st.shares=e.target.value;paint();}; $('inv').oninput=e=>{st.inv=e.target.value;paint();};
      $('pSound').onclick=()=>{Object.assign(st,{basis:'fd',pct:'0.5',shares:'',inv:'435000000'});sync();paint();};
      $('pEmp').onclick=()=>{Object.assign(st,{shares:'10000',pct:'',inv:''});sync();paint();};
      $('pReset').onclick=()=>{Object.assign(st,{shares:'',pct:'',inv:''});sync();paint();}; },
    film(){ const c=calc(), p=st.price; const rows=[
      {l:'Shares outstanding x '+money(p),n:fmt(c.out),t:'What the company is worth counting only shares that exist after the offering.'},
      {l:'Fully diluted x '+money(p),n:fmt(c.fd),t:'Adds options, RSUs, convertible-note shares and more: about 4.9 billion extra shares.',hi:true}];
      if(c.slice!=null) rows.push({l:'Your slice, gross',n:fmt(c.slice),t:c.how+(c.mult?'. '+c.mult.toFixed(1)+'x the money in.':'.'),hi:true});
      else rows.push({l:'The gap',n:fmt(c.gap),t:'Same price. Different share count.'});
      return {kick:'Anthropic IPO range: $70 to $78',hook:'One price. Two valuations.',rows,cue:'Try your own stake',src:'Source: Anthropic S-1/A as reported 2026-11-16. Gross, before strike, tax and lock-ups.'}; },
    og(){ return {k:'Anthropic IPO, $78 a share',h:'One price. Two valuations.',boxes:[['$1.021T','shares outstanding'],['$1.405T','fully diluted'],['$384B','the gap']],s:'iggym.github.io/p/anthropic-ipo-slice - S-1/A share counts as reported 2026-11-16'}; },
    shareUrl(){ const u=new URL(DATA.PAGE_URL); u.searchParams.set('price',st.price); if(st.basis!=='fd')u.searchParams.set('basis',st.basis); if(st.shares)u.searchParams.set('shares',st.shares); else if(st.pct)u.searchParams.set('pct',st.pct); if(st.inv)u.searchParams.set('inv',st.inv); return u.toString(); }
  }; return api; })();


const $ = id => document.getElementById(id);
const RENDER = document.documentElement.classList.contains('render');
const OG = document.documentElement.classList.contains('og');
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const Q = new URLSearchParams(location.search);
function el(tag, cls, text){ const e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=text; return e; }
$('byline').textContent=DATA.byline; $('title').textContent=DATA.title; $('intro').textContent=DATA.intro;
$('note').textContent=DATA.note;
(function(){ const ul=$('sources'); DATA.sources.forEach(s=>{ const li=el('li'); li.append(document.createTextNode(s.label+' ')); const a=el('a',null,s.url); a.href=s.url; a.rel='noopener'; li.append(a); ul.append(li); }); })();
const F = DATA.film;
const card=$('card'), stage=$('stage'); stage.setAttribute('role','img'); stage.setAttribute('aria-label',F.alt);
const kickEl=el('div','kick'), hookEl=el('div','hook'); const top0=el('div'); top0.append(kickEl,hookEl);
const rowsEl=el('div','rows'); const crow=[0,1,2].map(i=>{const r=el('div','row'); const l=el('div','rl'), n=el('div','rn'), t=el('div','rt'); r.append(l,n,t); rowsEl.append(r); return {r,l,n,t};});
const foot=el('div','foot'), cueEl=el('div','cue'), srcEl=el('div','src'); foot.append(cueEl,srcEl);
card.append(top0,rowsEl,foot);
function renderFilm(){ const f=APP.film(); kickEl.textContent=f.kick; hookEl.textContent=f.hook;
  f.rows.forEach((r,i)=>{const c=crow[i]; c.l.textContent=r.l; c.n.textContent=r.n; c.n.style.fontSize=r.n.length>13?'78px':''; c.t.textContent=r.t; c.r.classList.toggle('hi',!!r.hi);}); cueEl.textContent=f.cue; srcEl.textContent=f.src; }
const seg=(t,a,d)=>Math.max(0,Math.min(1,(t-a)/d)), ease=x=>x*x*(3-2*x);
function setTime(t){
  t=Math.max(0,Math.min(F.loopAt,Number(t)||0)); if(t>=F.loopAt)t=0;
  const m=ease(seg(t,F.hookEnd-.4,.4)); top0.style.transform='translateY('+((1-m)*420)+'px)';
  crow.forEach((c,i)=>{const o=ease(seg(t,F.stepStarts[i],F.dur)); c.r.style.opacity=o; c.r.style.transform='translateY('+((1-o)*40)+'px)'; c.n.style.transform='scale('+(.6+.4*o)+')';});
  foot.style.opacity=seg(t,F.posterStart,F.posterFade);
}
let raf=0;
function play(){ cancelAnimationFrame(raf); if(REDUCE){setTime(F.holdEnd);return;} const t0=performance.now();
  (function tick(now){const t=(now-t0)/1000; if(t>=F.holdEnd){setTime(F.holdEnd);return;} setTime(t); raf=requestAnimationFrame(tick);})(t0); }
window.__setTime=t=>{cancelAnimationFrame(raf); setTime(t);};
function fit(){ stage.style.setProperty('--s', RENDER?1:stage.clientWidth/1080); }
addEventListener('resize',fit); fit();
(function(){ const o=$('ogcard'), g=APP.og(); o.append(el('div','k',g.k),el('div','h',g.h)); const b=el('div','b'); g.boxes.forEach(x=>{const d=el('div'); d.append(el('b',null,x[0]),document.createTextNode(x[1])); b.append(d);}); o.append(b,el('div','s',g.s)); })();
APP.onChange=()=>{ renderFilm(); if(REDUCE||RENDER) setTime(RENDER?0:F.holdEnd); };
if(!RENDER && !OG){
  $('replay').onclick=play;
  $('share').onclick=async()=>{ const t=DATA.shareText+' '+APP.shareUrl(); try{await navigator.clipboard.writeText(t);$('sstatus').textContent='Copied to the clipboard.';}catch(e){$('sstatus').textContent='Copy this: '+t;} };
}
APP.init(); renderFilm(); setTime(0);
Promise.race([(document.fonts&&document.fonts.ready)||Promise.resolve(),new Promise(r=>setTimeout(r,800))]).then(()=>{fit();window.__ready=true;if(!RENDER&&!OG)play();});

</script>
</body>
</html>
