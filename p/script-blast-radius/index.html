<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f8fafc;color:#0f172a}
  :focus-visible{outline:3px solid #c2410c;outline-offset:2px}
  .wrap{max-width:40rem;margin:0 auto;padding:1.5rem 1rem 2.5rem}
  .by{font-size:.875rem;color:#475569;margin:0}
  h1{font-size:1.9rem;line-height:1.15;margin:.25rem 0 .5rem;font-weight:800}
  h2{font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:#475569;margin:0 0 .5rem}
  .intro{font-size:1.1rem;color:#334155;margin:0 0 1rem}
  .panel{margin-top:1rem;border:2px solid #cbd5e1;background:#f1f5f9;border-radius:1rem;padding:1rem}
  label{display:block;font-weight:700;margin:.6rem 0 .2rem}
  input[type=number],input[type=text],select,textarea{font:inherit;width:100%;min-height:48px;padding:.5rem .7rem;border:2px solid #64748b;border-radius:.6rem;background:#fff;color:#0f172a}
  textarea{min-height:11rem;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem}
  input[type=range]{width:100%;min-height:48px}
  button{font:inherit;min-height:48px;padding:.5rem 1rem;border-radius:.6rem;border:2px solid #64748b;background:#fff;font-weight:700;cursor:pointer;color:#0f172a}
  button.pri{background:#0f172a;color:#fff;border-color:#0f172a}
  button[aria-pressed=true]{background:#0f172a;color:#fff;border-color:#0f172a}
  .btns{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
  @media(max-width:30rem){.grid2{grid-template-columns:1fr}}
  .out{display:grid;gap:.6rem;margin-top:1rem}
  .card{background:#fff;border:2px solid #94a3b8;border-radius:.8rem;padding:.7rem 1rem}
  .card .l{font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#475569}
  .card .v{font-size:2rem;font-weight:900;line-height:1.1}
  .card .d{font-size:.95rem;color:#334155}
  .card.hi{border-color:#c2410c;background:#fff7ed}
  .card.bad{border-color:#b91c1c;background:#fef2f2}
  .card.good{border-color:#15803d;background:#f0fdf4}
  .small{font-size:.875rem;color:#475569}
  table{border-collapse:collapse;width:100%;font-size:.95rem;background:#fff}
  th,td{border:1px solid #94a3b8;padding:.4rem .5rem;text-align:left;vertical-align:top;word-break:break-all}
  a{color:#0f172a;font-weight:600;overflow-wrap:anywhere}
  li,.card .d,p{overflow-wrap:anywhere}
  pre{background:#0f172a;color:#e2e8f0;padding:.8rem;border-radius:.6rem;overflow:auto;font-size:.85rem;white-space:pre-wrap;word-break:break-all}
  #stage{position:relative;width:min(100%,340px);aspect-ratio:9/16;margin:1.5rem auto 0;overflow:hidden;border-radius:16px;background:#0b1530}
  #card{position:absolute;left:0;top:0;width:1080px;height:1920px;padding:70px 80px;background:#0b1530;color:#fff;transform-origin:0 0;transform:scale(var(--s,1));display:flex;flex-direction:column;gap:28px}
  .kick{font-size:44px;font-weight:600;color:#fdba74}
  .hook{font-size:84px;line-height:1.06;font-weight:800;letter-spacing:-1px}
  .rows{display:flex;flex-direction:column;gap:22px;margin-top:20px}
  .row{background:#fff;color:#0b1020;border-radius:24px;padding:24px 40px;border-left:20px solid #cbd5e1}
  .row.hi{border-left-color:#f97316}
  .rl{font-size:34px;font-weight:800;text-transform:uppercase;letter-spacing:2px;color:#334155}
  .rn{font-size:104px;line-height:1.05;font-weight:900;margin:4px 0 10px;transform-origin:0 60%}
  .rt{font-size:38px;line-height:1.22;font-weight:500}
  .foot{margin-top:auto}
  .cue{font-size:46px;font-weight:800}
  .src{font-size:32px;line-height:1.25;color:#cbd5e1;margin-top:12px}
  .render,.render body{margin:0;background:#0b1530!important;overflow:hidden}
  .render .wrap{max-width:none;padding:0;margin:0}
  .render .wrap>:not(#stage){display:none}
  .render #stage{position:fixed;left:0;top:0;width:1080px;height:1920px;border-radius:0;aspect-ratio:auto;margin:0}
  .og,.og body{margin:0;background:#0b1530!important;overflow:hidden}
  .og .wrap{display:none}
  #ogcard{display:none}
  .og #ogcard{display:flex;width:1200px;height:630px;padding:56px 64px;background:#0b1530;color:#fff;flex-direction:column;gap:22px}
  #ogcard .k{font-size:30px;font-weight:600;color:#fdba74}
  #ogcard .h{font-size:84px;line-height:1.05;font-weight:800;letter-spacing:-1px}
  #ogcard .b{display:flex;gap:24px}
  #ogcard .b div{background:#fff;color:#0b1020;border-radius:18px;padding:14px 26px;font-size:30px;font-weight:600}
  #ogcard .b b{display:block;font-size:60px;line-height:1.05;font-weight:900}
  #ogcard .s{font-size:26px;color:#cbd5e1;margin-top:auto}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <p class="by" id="byline"></p>
  <h1 id="title"></h1>
  <p class="intro" id="intro"></p>

  <section class="panel" aria-labelledby="t1">
    <h2 id="t1">Audit a page</h2>
    <label for="html">Paste the page HTML (view-source, copy all)</label>
    <textarea id="html" spellcheck="false" placeholder="&lt;html&gt;&#10;&lt;head&gt;&#10;&lt;script src=&quot;https://...&quot;&gt;"></textarea>
    <label for="dom">Your site's domain (auto-filled from canonical if found)</label>
    <input id="dom" type="text" inputmode="url" placeholder="shop.example.com" autocomplete="off">
    <div class="btns"><button id="sample" type="button">Load a made-up sample</button><button id="clear" type="button">Clear</button></div>
    <div class="out" id="out" aria-live="polite"></div>
    <div id="tbl"></div>
    <h2 style="margin-top:1rem">Starting-point CSP (report-only first)</h2>
    <pre id="csp" tabindex="0"></pre>
  </section>
  <section aria-label="Share">
    <p class="btns"><button id="share" type="button" class="pri">Copy a share link</button> <button id="replay" type="button">Replay the film</button></p>
    <p class="small" id="sstatus" aria-live="polite"></p>
  </section>
  <div id="stage"><div id="card"></div></div>
  <p class="small" id="note" style="margin-top:1.5rem"></p>
  <footer style="margin-top:1rem;border-top:2px solid #cbd5e1;padding-top:1rem">
    <h2>Sources</h2>
    <ul class="small" id="sources"></ul>
  </footer>
</div>
<div id="ogcard"></div>
<script>
const DATA = {
 "PAGE_URL": "https://iggym.github.io/p/script-blast-radius/",
 "byline": "By Iggy Mwangi (@iggym)",
 "title": "How many strangers can run code on your website?",
 "intro": "Last week a script host took down trust on hundreds of big sites at once. Count the outside hosts your own page already trusts. Nothing leaves your browser.",
 "note": "This reads only the HTML you paste. It cannot see scripts that other scripts load later, so the real number is higher than what it shows. 'Same site' is a simple guess from the last two parts of the domain. Integrity (SRI) pins one exact file, so it cannot be used on files a vendor changes. The CSP is a starting point to test in report-only mode, not a finished policy. Not security advice.",
 "sources": [
  {
   "label": "Scott Helme on X, Nov 16 2026 (8,857 likes, 1.78M views as returned by X on 2026-11-16): 'We are tracking a breach of a 3rd-party JS host impacting hundreds of high value websites.'",
   "url": "https://x.com/Scott_Helme/status/2122422157959471456"
  },
  {
   "label": "Scott Helme on X, Nov 16 2026: malicious JavaScript served through Optimizely, '178 organisations affected':",
   "url": "https://x.com/Scott_Helme/status/2122464168989098461"
  },
  {
   "label": "MDN, Subresource Integrity:",
   "url": "https://developer.mozilla.org/en-US/docs/Web/Security/Subresource_Integrity"
  },
  {
   "label": "MDN, Content-Security-Policy script-src:",
   "url": "https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Content-Security-Policy/script-src"
  }
 ],
 "shareText": "Every outside host in a page's script tags can run code on it. I counted mine:",
 "film": {
  "alt": "Short film: a sample page loads scripts from several outside hosts, most without an integrity pin; one reported incident hit 178 organisations.",
  "hookEnd": 1.5,
  "stepStarts": [
   1.6,
   3.7,
   5.8
  ],
  "dur": 0.8,
  "posterStart": 8,
  "posterFade": 0.5,
  "holdEnd": 9.5,
  "loopAt": 10
 },
 "sample": "<!doctype html>\n<html><head>\n<link rel=\"canonical\" href=\"https://shop.example.com/\">\n<script src=\"https://static.shop.example.com/app.js\" integrity=\"sha384-AAAA\" crossorigin=\"anonymous\"><\/script>\n<script src=\"https://cdn.ab-tests.example/js/1234.js\"><\/script>\n<script src=\"https://tags.analytics.example/loader.js\" async><\/script>\n<script src=\"https://widgets.chat.example/embed.js\" defer><\/script>\n<script src=\"//pixel.ads.example/p.js\"><\/script>\n<link rel=\"stylesheet\" href=\"https://fonts.cdn.example/css?family=Sans\">\n<script>window.dataLayer=[];<\/script>\n<\/head><body>\n<iframe src=\"https://pay.checkout.example/frame\"><\/iframe>\n<\/body><\/html>"
};

const APP=(function(){
  const SLD=new Set(['co','com','org','net','gov','ac','edu']);
  const reg=h=>{ const p=h.split('.'); if(p.length<=2)return h; const n=p.length; return (p[n-1].length===2&&SLD.has(p[n-2]))?p.slice(-3).join('.'):p.slice(-2).join('.'); };
  let sampleMode=true, last=null;
  function analyze(html,domIn){
    const doc=new DOMParser().parseFromString(html,'text/html');
    let dom=(domIn||'').trim().replace(/^https?:\/\//,'').replace(/\/.*$/,'').toLowerCase();
    if(!dom){ const c=doc.querySelector('link[rel~=canonical][href]')||doc.querySelector('meta[property="og:url"]'); const u=c&&(c.getAttribute('href')||c.getAttribute('content')); try{dom=new URL(u).hostname;}catch(e){} }
    const baseHost=dom||'example.invalid'; const baseUrl='https://'+baseHost+'/';
    const hosts={}; let inline=0, tp=0, tpNoSri=0, total=0, ifr=0;
    const hit=(u,kind,sri)=>{ let url; try{url=new URL(u,baseUrl);}catch(e){return;} if(!/^https?:$/.test(url.protocol))return;
      const h=url.hostname.toLowerCase(); const first=!!dom&&reg(h)===reg(baseHost); const o=hosts[h]||(hosts[h]={host:h,first,scripts:0,sri:0,css:0,iframes:0}); 
      if(kind==='script'){o.scripts++; total++; if(sri)o.sri++; if(!first){tp++; if(!sri)tpNoSri++;}} else if(kind==='css')o.css++; else {o.iframes++; if(!first)ifr++;} };
    doc.querySelectorAll('script').forEach(s=>{ if(s.src||s.getAttribute('src')) hit(s.getAttribute('src'),'script',!!s.getAttribute('integrity')); else if((s.textContent||'').trim()) inline++; });
    doc.querySelectorAll('link[rel~=modulepreload][href],link[rel~=preload][as=script][href]').forEach(l=>hit(l.getAttribute('href'),'script',!!l.getAttribute('integrity')));
    doc.querySelectorAll('link[rel~=stylesheet][href]').forEach(l=>hit(l.getAttribute('href'),'css',false));
    doc.querySelectorAll('iframe[src]').forEach(f=>hit(f.getAttribute('src'),'iframe',false));
    const list=Object.values(hosts).sort((a,b)=>(a.first-b.first)||(b.scripts-a.scripts)||a.host.localeCompare(b.host));
    const tpHosts=list.filter(h=>!h.first&&h.scripts>0);
    return {dom,list,tpHosts,tp,tpNoSri,inline,total,ifr}; }
  function paint(){
    const html=sampleMode?DATA.sample:$('html').value; const r=last=analyze(html,sampleMode?'':$('dom').value);
    if(!RENDER&&!OG&&!$('dom').value&&r.dom&&!sampleMode)$('dom').placeholder=r.dom+' (auto)';
    const o=$('out'); o.textContent='';
    const add=(cls,l,v,d)=>{const x=el('div','card '+cls); x.append(el('div','l',l),el('div','v',v),el('div','d',d)); o.append(x);};
    if(!html.trim()){ add('','Waiting','0','Paste HTML above, or load the sample.'); $('tbl').textContent=''; $('csp').textContent=''; api.onChange&&api.onChange(); return; }
    add('hi','Outside hosts that can run script on this page',String(r.tpHosts.length),r.tpHosts.map(h=>h.host).join(', ')||'none found in the HTML you pasted');
    add(r.tpNoSri?'bad':'good','Outside script tags with no integrity pin',r.tpNoSri+' of '+r.tp,r.tp?'Each can change what it serves, and your page runs it with full privileges.':'No outside script tags found.');
    add('','Inline script blocks',String(r.inline),'Inline code needs a nonce or hash under a strict CSP.');
    if(r.ifr)add('','Outside iframes',String(r.ifr),'Sandboxed by the browser, but still third-party content on your page.');
    const t=$('tbl'); t.textContent=''; const tb=el('table'); const hd=el('tr'); ['Host','Scripts','With integrity','Other'].forEach(x=>hd.append(el('th',null,x))); tb.append(hd);
    r.list.forEach(h=>{ const tr=el('tr'); tr.append(el('td',null,h.host+(h.first?' (same site)':'')),el('td',null,String(h.scripts)),el('td',null,h.scripts?h.sri+' of '+h.scripts:'-'),el('td',null,[h.css?h.css+' stylesheet':'',h.iframes?h.iframes+' iframe':''].filter(Boolean).join(', ')||'-')); tb.append(tr); });
    t.append(tb); const cap=el('p','small','Stylesheets and iframes are counted but are lower risk than scripts.'); t.append(cap);
    const own=r.list.filter(h=>h.first&&h.scripts>0).map(h=>h.host);
    $('csp').textContent="Content-Security-Policy-Report-Only: script-src 'self'"+(r.tpHosts.length?' '+r.tpHosts.map(h=>'https://'+h.host).join(' '):'')+(r.inline?" 'nonce-REPLACE_PER_REQUEST'":'')+"; report-to csp-endpoint\n"+(own.length?'/* same-site script hosts seen: '+own.join(', ')+' */':'');
    api.onChange&&api.onChange(); }
  const api={
    init(){ paint(); if(RENDER||OG)return;
      $('html').addEventListener('input',()=>{sampleMode=false;paint();}); $('dom').addEventListener('input',()=>{sampleMode=false;paint();});
      $('sample').onclick=()=>{sampleMode=true;$('html').value=DATA.sample;$('dom').value='';paint();};
      $('clear').onclick=()=>{sampleMode=false;$('html').value='';$('dom').value='';paint();}; $('html').value=DATA.sample; },
    film(){ const r=last||analyze(DATA.sample,''); const mine=!sampleMode&&$('html').value.trim();
      return {kick:mine?'Your page':'A made-up sample page',hook:'Who can run code on your site?',rows:[
        {l:'Outside script hosts',n:String(r.tpHosts.length),t:'Every one runs with your page\'s full privileges.'},
        {l:'Outside script tags, no integrity pin',n:r.tpNoSri+' of '+r.tp,t:'Nothing checks that the file is the one you meant to load.',hi:true},
        {l:'Reported on Nov 16 2026',n:'178',t:'organisations affected by malicious JavaScript served through Optimizely, per Scott Helme (@Scott_Helme).'}],
        cue:'Paste your own page',src:'Source: Scott Helme on X, 2026-11-16. Sample page is invented.'}; },
    og(){ return {k:'Reported Nov 16 2026: one script host, hundreds of sites',h:'How many strangers can run code on your site?',boxes:[['178','organisations affected, per Scott Helme'],['Free','paste HTML, runs in your browser']],s:'iggym.github.io/p/script-blast-radius'}; },
    shareUrl(){ return DATA.PAGE_URL; }
  }; return api; })();


const $ = id => document.getElementById(id);
const RENDER = document.documentElement.classList.contains('render');
const OG = document.documentElement.classList.contains('og');
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const Q = new URLSearchParams(location.search);
function el(tag, cls, text){ const e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=text; return e; }
$('byline').textContent=DATA.byline; $('title').textContent=DATA.title; $('intro').textContent=DATA.intro;
$('note').textContent=DATA.note;
(function(){ const ul=$('sources'); DATA.sources.forEach(s=>{ const li=el('li'); li.append(document.createTextNode(s.label+' ')); const a=el('a',null,s.url); a.href=s.url; a.rel='noopener'; li.append(a); ul.append(li); }); })();
const F = DATA.film;
const card=$('card'), stage=$('stage'); stage.setAttribute('role','img'); stage.setAttribute('aria-label',F.alt);
const kickEl=el('div','kick'), hookEl=el('div','hook'); const top0=el('div'); top0.append(kickEl,hookEl);
const rowsEl=el('div','rows'); const crow=[0,1,2].map(i=>{const r=el('div','row'); const l=el('div','rl'), n=el('div','rn'), t=el('div','rt'); r.append(l,n,t); rowsEl.append(r); return {r,l,n,t};});
const foot=el('div','foot'), cueEl=el('div','cue'), srcEl=el('div','src'); foot.append(cueEl,srcEl);
card.append(top0,rowsEl,foot);
function renderFilm(){ const f=APP.film(); kickEl.textContent=f.kick; hookEl.textContent=f.hook;
  f.rows.forEach((r,i)=>{const c=crow[i]; c.l.textContent=r.l; c.n.textContent=r.n; c.n.style.fontSize=r.n.length>13?'78px':''; c.t.textContent=r.t; c.r.classList.toggle('hi',!!r.hi);}); cueEl.textContent=f.cue; srcEl.textContent=f.src; }
const seg=(t,a,d)=>Math.max(0,Math.min(1,(t-a)/d)), ease=x=>x*x*(3-2*x);
function setTime(t){
  t=Math.max(0,Math.min(F.loopAt,Number(t)||0)); if(t>=F.loopAt)t=0;
  const m=ease(seg(t,F.hookEnd-.4,.4)); top0.style.transform='translateY('+((1-m)*420)+'px)';
  crow.forEach((c,i)=>{const o=ease(seg(t,F.stepStarts[i],F.dur)); c.r.style.opacity=o; c.r.style.transform='translateY('+((1-o)*40)+'px)'; c.n.style.transform='scale('+(.6+.4*o)+')';});
  foot.style.opacity=seg(t,F.posterStart,F.posterFade);
}
let raf=0;
function play(){ cancelAnimationFrame(raf); if(REDUCE){setTime(F.holdEnd);return;} const t0=performance.now();
  (function tick(now){const t=(now-t0)/1000; if(t>=F.holdEnd){setTime(F.holdEnd);return;} setTime(t); raf=requestAnimationFrame(tick);})(t0); }
window.__setTime=t=>{cancelAnimationFrame(raf); setTime(t);};
function fit(){ stage.style.setProperty('--s', RENDER?1:stage.clientWidth/1080); }
addEventListener('resize',fit); fit();
(function(){ const o=$('ogcard'), g=APP.og(); o.append(el('div','k',g.k),el('div','h',g.h)); const b=el('div','b'); g.boxes.forEach(x=>{const d=el('div'); d.append(el('b',null,x[0]),document.createTextNode(x[1])); b.append(d);}); o.append(b,el('div','s',g.s)); })();
APP.onChange=()=>{ renderFilm(); if(REDUCE||RENDER) setTime(RENDER?0:F.holdEnd); };
if(!RENDER && !OG){
  $('replay').onclick=play;
  $('share').onclick=async()=>{ const t=DATA.shareText+' '+APP.shareUrl(); try{await navigator.clipboard.writeText(t);$('sstatus').textContent='Copied to the clipboard.';}catch(e){$('sstatus').textContent='Copy this: '+t;} };
}
APP.init(); renderFilm(); setTime(0);
Promise.race([(document.fonts&&document.fonts.ready)||Promise.resolve(),new Promise(r=>setTimeout(r,800))]).then(()=>{fit();window.__ready=true;if(!RENDER&&!OG)play();});

</script>
</body>
</html>
